name: Fix client pagination once
on:
  push:
    paths:
      - '.github/workflows/fix-client-pagination-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paginar carregamento de clientes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('CRM-Integral-IA-Andamentos-Importacao-Excel/app.js')
          s=p.read_text()
          marker='async function fetchAllClientsPaged()'
          if marker not in s:
              helper='''\nasync function fetchAllClientsPaged() {\n  const pageSize = 1000;\n  const rows = [];\n  for (let from = 0; ; from += pageSize) {\n    const { data, error } = await supabase\n      .from("clientes")\n      .select("*")\n      .order("created_at", { ascending: false })\n      .range(from, from + pageSize - 1);\n    if (error) return { data: null, error };\n    rows.push(...(data || []));\n    if (!data || data.length < pageSize) break;\n  }\n  return { data: rows, error: null };\n}\n\n'''
              anchor='async function loadData() {'
              if anchor not in s:
                  raise SystemExit('loadData nao encontrado')
              s=s.replace(anchor,helper+anchor,1)

          start=s.index('async function loadData() {')
          segment=s[start:start+9000]
          pattern=r'supabase\.from\("clientes"\)\.select\("\*"\)(?:\.order\([^\n]+\))?'
          matches=list(re.finditer(pattern,segment))
          if not matches:
              raise SystemExit('consulta de clientes nao encontrada dentro de loadData')
          m=matches[0]
          segment=segment[:m.start()]+'fetchAllClientsPaged()'+segment[m.end():]
          s=s[:start]+segment+s[start+9000:]
          p.write_text(s)
          PY
          cd CRM-Integral-IA-Andamentos-Importacao-Excel
          npm run build
          cd ..
          git config user.name "Integral CRM Fix"
          git config user.email "actions@users.noreply.github.com"
          git add CRM-Integral-IA-Andamentos-Importacao-Excel/app.js CRM-Integral-IA-Andamentos-Importacao-Excel/dist
          git commit -m "fix: carregar todos os clientes com paginacao" || true
          git push
