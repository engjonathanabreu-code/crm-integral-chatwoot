name: Fix CRM white screen after user history

on:
  push:
    paths:
      - '.github/workflows/fix-white-screen-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair escaped newlines introduced by history patch
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('CRM-Integral-IA-Andamentos-Importacao-Excel')
          app_path = root / 'app.js'
          css_path = root / 'style.css'

          app = app_path.read_text()
          marker = r'\n\nfunction getUserOperationalHistory(userId) {'
          end_marker = '\n function renderUsers() {'
          if marker in app:
              start = app.index(marker)
              end = app.index(end_marker, start)
              block = app[start:end]
              block = block.replace(r'\n', '\n')
              app = app[:start] + block + app[end:]

          css = css_path.read_text()
          css_marker = r'\n\n/* Histórico operacional explícito no editor de usuário */'
          if css_marker in css:
              start = css.index(css_marker)
              block = css[start:].replace(r'\n', '\n')
              css = css[:start] + block

          app_path.write_text(app)
          css_path.write_text(css)
          PY
      - name: Validate JavaScript syntax
        run: node --check CRM-Integral-IA-Andamentos-Importacao-Excel/app.js
      - name: Commit repair
        run: |
          git config user.name "Integral Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CRM-Integral-IA-Andamentos-Importacao-Excel/app.js CRM-Integral-IA-Andamentos-Importacao-Excel/style.css
          git commit -m "fix: corrigir tela branca apos histórico de usuários" || exit 0
          git push
