name: Editar andamentos no codigo fonte
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/edit-progress-source.yml
      - scripts/refactor-progress-edit.py
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar refatoracao
        run: python3 scripts/refactor-progress-edit.py
      - name: Validar build
        run: |
          cd CRM-Integral-IA-Andamentos-Importacao-Excel
          node --check app.js
          npm run build
      - name: Commit definitivo
        run: |
          rm -f .github/workflows/edit-progress-source.yml scripts/refactor-progress-edit.py
          git config user.name "Integral CRM Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add CRM-Integral-IA-Andamentos-Importacao-Excel/app.js .github/workflows/edit-progress-source.yml scripts/refactor-progress-edit.py
          git commit -m "feat: permite editar andamentos no codigo principal"
          git push
