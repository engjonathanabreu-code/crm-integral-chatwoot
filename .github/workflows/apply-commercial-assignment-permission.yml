name: Fix CRM commercial permission build

on:
  push:
    paths:
      - '.github/workflows/apply-commercial-assignment-permission.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align build templates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CRM-Integral-IA-Andamentos-Importacao-Excel/scripts/build.mjs')
          source = path.read_text()
          source = source.replace(
            'Só o Admin ou quem cadastrou o cliente pode atribuir/trocar o Comercial.',
            'Admin, usuários do Comercial ou quem cadastrou o cliente podem atribuir/trocar o Comercial.'
          )
          path.write_text(source)
          PY
      - name: Commit changes
        run: |
          git config user.name "Integral Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CRM-Integral-IA-Andamentos-Importacao-Excel/scripts/build.mjs
          git commit -m "fix: alinhar build à permissão do Comercial" || exit 0
          git push
