name: CRM sem confirmacao por email
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/crm-auth-no-confirmation.yml
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar no codigo fonte
        run: python3 .github/patch_crm_auth_no_email.py
      - name: Validar
        run: |
          node --check CRM-Integral-IA-Andamentos-Importacao-Excel/app.js
          node --check CRM-Integral-IA-Andamentos-Importacao-Excel/api/admin-user-create.js
          cd CRM-Integral-IA-Andamentos-Importacao-Excel && npm run build
      - name: Commit definitivo
        run: |
          rm -f .github/patch_crm_auth_no_email.py .github/workflows/crm-auth-no-confirmation.yml
          git config user.name "Integral CRM Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add CRM-Integral-IA-Andamentos-Importacao-Excel/app.js CRM-Integral-IA-Andamentos-Importacao-Excel/api/admin-user-create.js .github/patch_crm_auth_no_email.py .github/workflows/crm-auth-no-confirmation.yml
          git commit -m "feat: cria usuarios do CRM sem confirmar email"
          git push
