name: Refatorar usuarios direto no CRM

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refactor-users-direct.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar refatoracao
        run: python3 CRM-Integral-IA-Andamentos-Importacao-Excel/scripts/refactor_users.py

      - name: Validar build e sintaxe
        run: |
          cd CRM-Integral-IA-Andamentos-Importacao-Excel
          npm run build
          node --check app.js
          grep -q 'data-edit-user' app.js
          grep -q 'resetPasswordEmail' index.html
          test ! -e users-admin.js
          cd ..
          test ! -e .github/workflows/refactor-users-direct.yml

      - name: Commit definitivo
        run: |
          git config user.name 'Integral CRM Refactor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: usuarios em cards editaveis no codigo principal'
          git push origin main
