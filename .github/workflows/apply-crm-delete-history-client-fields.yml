name: Apply CRM delete/history/client-field fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('CRM-Integral-IA-Andamentos-Importacao-Excel')
          app_path=root/'app.js'
          index_path=root/'index.html'
          css_path=root/'style.css'
          app=app_path.read_text()
          index=index_path.read_text()
          css=css_path.read_text()

          # 1) Remove os dois campos solicitados do formulário.
          index=index.replace('        <label>Responsável operacional<input id="clientResponsible" /></label>\n','')
          index=index.replace('        <label>Estado civil<input id="clientCivilStatus" /></label>\n','')

          # 2) Estado de histórico de usuário.
          if 'userHistory: []' not in app:
              app=app.replace('  history: [],\n  interactions: [],','  history: [],\n  userHistory: [],\n  interactions: [],',1)
              app=app.replace('    history: [],\n  interactions: [],','    history: [],\n    userHistory: [],\n    interactions: [],',1)

          # 3) Carrega usuario_historico junto com os dados operacionais.
          old='const [profilesResult, clientsResult, ticketsResult, tasksResult, historyResult, interactionsResult, etapasResult, projectsResult, progressResult] = await Promise.all(['
          new='const [profilesResult, clientsResult, ticketsResult, tasksResult, historyResult, userHistoryResult, interactionsResult, etapasResult, projectsResult, progressResult] = await Promise.all(['
          app=app.replace(old,new)
          app=app.replace('      supabase.from("historico").select("*").order("created_at", { ascending: false }),\n      supabase.from("interacoes")', '      supabase.from("historico").select("*").order("created_at", { ascending: false }),\n      supabase.from("usuario_historico").select("*").order("created_at", { ascending: false }),\n      supabase.from("interacoes")')
          app=app.replace('const failures = [profilesResult, clientsResult, ticketsResult, tasksResult, historyResult, interactionsResult, etapasResult, projectsResult, progressResult]', 'const failures = [profilesResult, clientsResult, ticketsResult, tasksResult, historyResult, userHistoryResult, interactionsResult, etapasResult, projectsResult, progressResult]')
          app=app.replace('    state.history = historyResult.data || [];\n    state.interactions = interactionsResult.data || [];', '    state.history = historyResult.data || [];\n    state.userHistory = userHistoryResult.data || [];\n    state.interactions = interactionsResult.data || [];')

          # 4) Remove referências funcionais aos campos retirados, sem apagar dados antigos do banco.
          app=app.replace('  $("clientResponsible").value = state.profile.nome;\n','')
          app=app.replace('  $("clientResponsible").value = client.responsavel || "";\n','')
          app=app.replace('    responsavel: $("clientResponsible").value.trim() || null,\n','')
          app=app.replace('    estado_civil: $("clientCivilStatus")?.value.trim() || null,\n','')
          app=app.replace('    origem: "Origem", status: "Status", valor_estimado: "Valor estimado", responsavel: "Responsável", codigo_processo: "Código do processo", estado_civil: "Estado civil", observacoes: "Observações", owner_id: "Dono do registro", comercial_id: "Comercial", agentes_atribuidos: "Agentes atribuídos",', '    origem: "Origem", status: "Status", valor_estimado: "Valor estimado", codigo_processo: "Código do processo", observacoes: "Observações", owner_id: "Dono do registro", comercial_id: "Comercial", agentes_atribuidos: "Agentes atribuídos",')
          app=app.replace('    ["Responsável operacional", client.responsavel || "-"], ["Dono do registro", profileName(client.owner_id)],', '    ["Dono do registro", profileName(client.owner_id)],')
          app=app.replace('    ["Estado civil", client.estado_civil || "-"], ["Tipo documental", client.tipo_documental || "-"],', '    ["Tipo documental", client.tipo_documental || "-"],')

          # 5) Permissão de exclusão e registro persistente no histórico do usuário.
          marker='function renderTickets() {'
          helper='''function canDeleteOperationalRecord(record) {\n  return isAdmin() || record?.created_by === state.user?.id;\n}\n\nasync function recordUserActivity({ userId, type, description, entity, entityId, data }) {\n  const targetUser = userId || state.user.id;\n  const { error } = await supabase.from("usuario_historico").insert({\n    usuario_id: targetUser,\n    executado_por: state.user.id,\n    tipo: type,\n    descricao: description,\n    entidade: entity,\n    entidade_id: entityId || null,\n    dados: data || null,\n  });\n  if (error) console.warn("Não foi possível registrar histórico do usuário:", error);\n  return !error;\n}\n\n'''
          if 'function canDeleteOperationalRecord' not in app:
              app=app.replace(marker,helper+marker,1)

          # 6) Botões de excluir em Atendimentos e Tarefas.
          old_ticket='${ticket.status !== "Resolvido" ? `<button class="primary small-button" data-resolve-ticket="${ticket.id}">Resolver</button>` : ""}\n      </div>'
          new_ticket='${ticket.status !== "Resolvido" ? `<button class="primary small-button" data-resolve-ticket="${ticket.id}">Resolver</button>` : ""}\n        ${canDeleteOperationalRecord(ticket) ? `<button class="danger small-button" data-delete-ticket="${ticket.id}">Excluir</button>` : ""}\n      </div>'
          app=app.replace(old_ticket,new_ticket)
          old_task='<button class="primary small-button" data-toggle-task="${task.id}">${task.concluida ? "Reabrir" : "Concluir"}</button>\n      </div>'
          new_task='<button class="primary small-button" data-toggle-task="${task.id}">${task.concluida ? "Reabrir" : "Concluir"}</button>\n        ${canDeleteOperationalRecord(task) ? `<button class="danger small-button" data-delete-task="${task.id}">Excluir</button>` : ""}\n      </div>'
          app=app.replace(old_task,new_task)

          # 7) Funções de exclusão. Mantém cópia completa no usuario_historico.
          toggle_end='''async function toggleTask(id) {\n  const task = state.tasks.find((item) => item.id === id);\n  if (!task) return;\n  const { error } = await supabase.from("tarefas").update({ concluida: !task.concluida }).eq("id", id);\n  if (error) return showToast(friendlyErrorMessage(error), "error");\n  await loadData();\n  showToast(task.concluida ? "Tarefa reaberta." : "Tarefa concluída.");\n}\n'''
          delete_funcs='''\nasync function deleteTicket(id) {\n  const ticket = state.tickets.find((item) => item.id === id);\n  if (!ticket || !canDeleteOperationalRecord(ticket)) return showToast("Você não tem permissão para excluir este atendimento.", "error");\n  if (!window.confirm(`Excluir o atendimento "${ticket.assunto || "Sem assunto"}"?\\n\\nEle sairá da lista operacional, mas continuará registrado no histórico do usuário.`)) return;\n  const { error } = await supabase.from("atendimentos").delete().eq("id", id);\n  if (error) return showToast(friendlyErrorMessage(error), "error");\n  await recordUserActivity({\n    userId: ticket.created_by || state.user.id,\n    type: "Atendimento excluído",\n    description: `Atendimento removido da lista operacional: ${ticket.assunto || "Sem assunto"} • Setor: ${ticket.setor || "Não informado"}.`,\n    entity: "atendimento", entityId: ticket.id, data: ticket,\n  });\n  await loadData();\n  showToast("Atendimento excluído e preservado no histórico do usuário.");\n}\n\nasync function deleteTask(id) {\n  const task = state.tasks.find((item) => item.id === id);\n  if (!task || !canDeleteOperationalRecord(task)) return showToast("Você não tem permissão para excluir esta tarefa.", "error");\n  if (!window.confirm(`Excluir a tarefa "${task.titulo || "Sem título"}"?\\n\\nEla sairá da agenda, mas continuará registrada no histórico do usuário.`)) return;\n  const { error } = await supabase.from("tarefas").delete().eq("id", id);\n  if (error) return showToast(friendlyErrorMessage(error), "error");\n  await recordUserActivity({\n    userId: task.created_by || state.user.id,\n    type: "Tarefa excluída",\n    description: `Tarefa removida da lista operacional: ${task.titulo || "Sem título"}${task.data ? ` • Prazo: ${formatDate(task.data)}` : ""}.`,\n    entity: "tarefa", entityId: task.id, data: task,\n  });\n  await loadData();\n  showToast("Tarefa excluída e preservada no histórico do usuário.");\n}\n'''
          if 'async function deleteTicket(id)' not in app:
              if toggle_end not in app:
                  raise SystemExit('toggleTask block not found')
              app=app.replace(toggle_end,toggle_end+delete_funcs,1)

          # 8) Histórico visível dentro de cada card de usuário.
          start=app.index('function renderUsers() {')
          end=app.index('\nfunction marketingProgressFor(',start)
          new_render=r'''function renderUsers() {
  if (!isAdmin()) return;

  $("usersCount").textContent = state.profiles.length;
  const roleLabels = { usuario: "Usuário", comercial: "Comercial", marketing: "Marketing", admin: "Administrador" };

  const historyFor = (profile) => {
    const persisted = state.userHistory
      .filter((item) => item.usuario_id === profile.id)
      .map((item) => ({
        date: item.created_at,
        type: item.tipo || "Atividade",
        text: item.descricao || "Sem descrição",
        entity: item.entidade || "",
        entityId: item.entidade_id || "",
        persisted: true,
      }));
    const persistedKeys = new Set(persisted.map((item) => `${item.entity}:${item.entityId}:${item.type}`));
    const currentTickets = state.tickets
      .filter((item) => isCrmTicket(item) && item.created_by === profile.id)
      .filter((item) => !persistedKeys.has(`atendimento:${item.id}:Atendimento criado`))
      .map((item) => ({ date: item.created_at, type: "Atendimento criado", text: `${item.assunto || "Sem assunto"} • ${clientName(item.cliente_id)} • ${item.setor || "Sem setor"}`, entity: "atendimento", entityId: item.id }));
    const currentTasks = state.tasks
      .filter((item) => item.created_by === profile.id)
      .filter((item) => !persistedKeys.has(`tarefa:${item.id}:Tarefa criada`))
      .map((item) => ({ date: item.created_at || item.data, type: "Tarefa criada", text: `${item.titulo || "Sem título"} • ${clientName(item.cliente_id)}${item.data ? ` • Prazo ${formatDate(item.data)}` : ""}`, entity: "tarefa", entityId: item.id }));
    return [...persisted, ...currentTickets, ...currentTasks]
      .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0))
      .slice(0, 40);
  };

  $("usersList").innerHTML = state.profiles.length ? state.profiles.map((profile) => {
    const activities = historyFor(profile);
    return `<article class="user-admin-card user-admin-card-with-history">
      <div class="user-admin-card-head">
        <div>
          <strong>${escapeHtml(profile.nome || profile.apelido || "Usuário")}</strong>
          <span class="muted">${escapeHtml(profile.email || "E-mail não informado")}</span>
        </div>
        <div class="user-card-head-actions">
          <span class="badge ${profile.ativo ? "closed" : "lost"}">${profile.ativo ? "Ativo" : "Inativo"}</span>
          <button type="button" class="secondary small-button" data-edit-user="${profile.id}">Editar usuário</button>
        </div>
      </div>
      <div class="user-admin-card-meta">
        <span><b>Setor:</b> ${escapeHtml(profile.setor || "—")}</span>
        <span><b>Função:</b> ${escapeHtml(roleLabels[profile.perfil] || "Usuário")}</span>
        <span><b>Usuário:</b> ${profile.apelido ? `@${escapeHtml(profile.apelido)}` : "—"}</span>
        <span><b>Histórico:</b> ${activities.length} registro(s)</span>
      </div>
      <details class="user-activity-history">
        <summary>Histórico de atendimentos e tarefas</summary>
        <div class="user-activity-list">
          ${activities.length ? activities.map((item) => `<div class="user-activity-item">
            <div><strong>${escapeHtml(item.type)}</strong><span>${escapeHtml(item.text)}</span></div>
            <time>${formatDateTime(item.date)}</time>
          </div>`).join("") : `<div class="empty-state compact">Nenhum atendimento ou tarefa registrado por este usuário.</div>`}
        </div>
      </details>
    </article>`;
  }).join("") : emptyState("Nenhum usuário encontrado.");
}
'''
          app=app[:start]+new_render+app[end:]

          # 9) Eventos de exclusão.
          needle='''    const taskButton = event.target.closest("[data-toggle-task]");\n    if (taskButton) toggleTask(taskButton.dataset.toggleTask);\n'''
          repl=needle+'''\n    const deleteTicketButton = event.target.closest("[data-delete-ticket]");\n    if (deleteTicketButton) deleteTicket(deleteTicketButton.dataset.deleteTicket);\n\n    const deleteTaskButton = event.target.closest("[data-delete-task]");\n    if (deleteTaskButton) deleteTask(deleteTaskButton.dataset.deleteTask);\n'''
          if '[data-delete-ticket]' not in app[app.index('function bindEvents()'):]:
              if needle not in app:
                  raise SystemExit('event task block not found')
              app=app.replace(needle,repl,1)

          # 10) CSS para card de usuário com histórico, preservando o visual atual.
          css_patch='''\n\n/* Histórico operacional dentro dos cards de usuário */\n.user-admin-card-with-history{display:block;width:100%;text-align:left;cursor:default}\n.user-card-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}\n.user-activity-history{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}\n.user-activity-history>summary{cursor:pointer;font-size:12px;font-weight:650;color:var(--text);list-style:none;display:flex;align-items:center;justify-content:space-between}\n.user-activity-history>summary::-webkit-details-marker{display:none}\n.user-activity-history>summary::after{content:'+';font-size:16px;color:var(--muted)}\n.user-activity-history[open]>summary::after{content:'−'}\n.user-activity-list{display:grid;gap:7px;margin-top:10px;max-height:320px;overflow:auto;padding-right:3px}\n.user-activity-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2)}\n.user-activity-item div{display:grid;gap:3px;min-width:0}\n.user-activity-item strong{font-size:11.5px}\n.user-activity-item span,.user-activity-item time{font-size:10.5px;color:var(--muted);line-height:1.4}\n.user-activity-item time{white-space:nowrap}\n.record-actions .danger{white-space:nowrap}\n@media(max-width:760px){.user-activity-item{grid-template-columns:1fr}.user-card-head-actions{justify-content:flex-start}}\n'''
          if 'Histórico operacional dentro dos cards de usuário' not in css:
              css += css_patch

          app_path.write_text(app)
          index_path.write_text(index)
          css_path.write_text(css)
          PY
      - name: Commit source changes
        run: |
          git config user.name "Integral Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CRM-Integral-IA-Andamentos-Importacao-Excel/app.js CRM-Integral-IA-Andamentos-Importacao-Excel/index.html CRM-Integral-IA-Andamentos-Importacao-Excel/style.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: excluir tarefas e atendimentos com histórico por usuário"
          git push
