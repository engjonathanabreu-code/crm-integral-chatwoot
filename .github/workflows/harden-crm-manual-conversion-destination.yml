name: Harden CRM Manual Conversion Destination

# Executa a correção sobre o dashboard já publicado.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-crm-manual-conversion-destination.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Corrigir detecção de conversão manual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CRM-Integral-IA-Andamentos-Importacao-Excel/crm-dashboard-analytics.js')
          s=p.read_text()
          old="""      const text=norm(h.descricao || '');
      return text.includes('status') && text.includes('cliente ativo');"""
          new="""      const text=String(h.descricao || '');
      // Conta somente a transição explícita DE outro status PARA Cliente Ativo.
      // Ex.: 'Negociação → Cliente Ativo'. Não conta 'Cliente Ativo → Negociação'
      // nem clientes criados/importados diretamente como Cliente Ativo.
      return /Status:\\s*(?!Cliente Ativo\\b)[^\\n→]+\\s*→\\s*Cliente Ativo\\b/i.test(text);"""
          if old not in s:
              raise SystemExit('helper antigo não encontrado')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'Integral Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add CRM-Integral-IA-Andamentos-Importacao-Excel/crm-dashboard-analytics.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: contar somente transição manual para Cliente Ativo [skip ci]'
          git push origin main
